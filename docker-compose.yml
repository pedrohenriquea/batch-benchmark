name: batch-benchmark

services:
  postgres:
    image: postgres:16
    container_name: bb-postgres
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: benchmark
    ports:
      # Publicado em 5433 no host para nao conflitar com instalacoes locais de PostgreSQL.
      # (A app dentro do Compose acessa via "postgres:5432" na rede interna.)
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d benchmark"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Recursos controlados para garantir comparabilidade entre execucoes.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  app:
    build: .
    container_name: bb-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/benchmark?reWriteBatchedInserts=true
      SPRING_DATASOURCE_USERNAME: benchmark
      SPRING_DATASOURCE_PASSWORD: benchmark
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: bb-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.2.0
    container_name: bb-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
